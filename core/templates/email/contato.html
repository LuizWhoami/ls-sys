<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo orçamento - LS Tech</title>
</head>
<body style="margin:0;padding:24px;background-color:#050608;font-family:'Segoe UI',Arial,sans-serif;color:#F4F7FB;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:0 auto;background-color:#101318;border:1px solid #1E2433;border-radius:16px;overflow:hidden;">
        <tr>
            <td style="padding:32px;text-align:center;background:linear-gradient(135deg,#0B1120 0%,#16112B 100%);border-bottom:2px solid #5B4BFF;">
                <h1 style="margin:0;font-size:26px;letter-spacing:-0.5px;color:#FFFFFF;">
                    LS <span style="color:#1FA2FF;">Tech</span>
                </h1>
                <p style="margin:6px 0 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#94A3B8;">
                    Beyond Digital • Nova Solicitação
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding:32px;">
                <h2 style="margin:0 0 20px;font-size:18px;color:#F4F7FB;">Detalhes do contato recebido</h2>

                <div style="margin-bottom:14px;padding:14px 16px;background:#07090E;border-left:3px solid #1FA2FF;border-radius:8px;">
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748B;margin-bottom:4px;">Nome</div>
                    <div style="font-size:15px;color:#F4F7FB;font-weight:600;">{{ nome }}</div>
                </div>

                <div style="margin-bottom:14px;padding:14px 16px;background:#07090E;border-left:3px solid #5B4BFF;border-radius:8px;">
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748B;margin-bottom:4px;">Empresa</div>
                    <div style="font-size:15px;color:#F4F7FB;">{{ empresa }}</div>
                </div>

                <div style="margin-bottom:14px;padding:14px 16px;background:#07090E;border-left:3px solid #1FA2FF;border-radius:8px;">
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748B;margin-bottom:4px;">E-mail</div>
                    <div style="font-size:15px;"><a href="mailto:{{ email }}" style="color:#1FA2FF;text-decoration:none;">{{ email }}</a></div>
                </div>

                <div style="margin-bottom:14px;padding:14px 16px;background:#07090E;border-left:3px solid #8A2BE2;border-radius:8px;">
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748B;margin-bottom:4px;">WhatsApp</div>
                    <div style="font-size:15px;color:#F4F7FB;">{{ whatsapp }}</div>
                </div>

                <div style="padding:16px;background:#07090E;border:1px solid #1E2433;border-radius:8px;">
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748B;margin-bottom:8px;">Mensagem do projeto</div>
                    <div style="font-size:14px;line-height:1.6;color:#CBD5E1;white-space:pre-wrap;">{{ mensagem }}</div>
                </div>
            </td>
        </tr>
        <tr>
            <td style="padding:20px 32px;text-align:center;background:#07090E;border-top:1px solid #1E2433;font-size:12px;color:#64748B;">
                Enviado via <strong style="color:#94A3B8;">lstech.dev.br</strong>
            </td>
        </tr>
    </table>
</body>
</html>
